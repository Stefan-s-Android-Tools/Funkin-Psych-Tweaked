name: Build

on:
  push:
    branches: [main, experimental]
    paths-ignore: ['**.md', 'docs/**', 'documents-mobile/**', 'art/**', '.vscode/**']
  pull_request:
    branches: [main, experimental]
    paths-ignore: ['**.md', 'docs/**', 'documents-mobile/**', 'art/**', '.vscode/**']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HAXE_VERSION: '4.3.7'
  HAXELIB_CACHE_REV: 'v5-cairo'

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: android
            os: ubuntu-latest
            host: linux
          - target: linux
            os: ubuntu-latest
            host: linux
          - target: windows
            os: windows-latest
            host: windows
          - target: mac
            os: macos-15
            host: mac
          - target: ios
            os: macos-15
            host: mac
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set hxcpp cache path
        run: echo "HXCPP_COMPILE_CACHE=$RUNNER_TEMP/hxcpp_cache" >> "$GITHUB_ENV"

      - name: Install Linux packages
        if: matrix.host == 'linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential git pkg-config libx11-dev libxi-dev libxext-dev libxinerama-dev libxrandr-dev libgl-dev libasound2-dev libpulse-dev libwayland-dev libxkbcommon-dev libegl-dev libxcursor-dev libxss-dev libxtst-dev libdbus-1-dev libudev-dev libvlc-dev libvlccore-dev

      - name: Java 17
        if: matrix.target == 'android'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android NDK
        if: matrix.target == 'android'
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r21e
          local-cache: true

      - name: Haxe
        uses: krdlab/setup-haxe@master
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Cache Haxelibs
        id: haxelib-cache
        uses: actions/cache@v4
        with:
          path: .haxelib
          key: haxelib-${{ env.HAXELIB_CACHE_REV }}-${{ matrix.target }}-${{ env.HAXE_VERSION }}-${{ hashFiles('hmm.json') }}

      - name: Cache hxcpp
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/hxcpp_cache
          key: hxcpp-${{ matrix.target }}-${{ github.sha }}
          restore-keys: |
            hxcpp-${{ matrix.target }}-

      - name: Install Haxelibs
        run: |
          set -euo pipefail
          mkdir -p "$HXCPP_COMPILE_CACHE"
          haxelib --global install hmm --quiet
          haxelib --global run hmm install
          haxelib list

      - name: Prepare Lime Git dependencies
        run: |
          set -euo pipefail
          LIME="$(haxelib libpath lime | head -n 1)"
          echo "Lime: $LIME"
          if [ -d "$LIME/.git" ]; then
            git -C "$LIME" submodule sync --recursive
            git -C "$LIME" submodule update --init --recursive
          fi
          if [ -f "$LIME/project/Build.xml" ]; then
            echo "Lime native project exists"
          fi
          find "$LIME" -name 'cairo-files.xml' -print | head -n 10

      - name: Build Lime host native library
        run: |
          set -euo pipefail
          LIME="$(haxelib libpath lime | head -n 1)"
          case '${{ matrix.host }}' in
            linux) HOST_TARGET=linux ;;
            windows) HOST_TARGET=windows ;;
            mac) HOST_TARGET=mac ;;
          esac
          echo "Preparing Lime for $HOST_TARGET"
          haxelib run lime rebuild "$HOST_TARGET" -64 -release
          echo "Checking Lime native files:"
          find "$LIME/ndll" -maxdepth 3 \( -name 'lime.ndll' -o -name 'lime.hdll' \) -print || true

      - name: Configure Android
        if: matrix.target == 'android'
        env:
          NDK_PATH: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          haxelib run lime config ANDROID_SDK "$ANDROID_HOME"
          haxelib run lime config ANDROID_NDK_ROOT "$NDK_PATH"
          haxelib run lime config JAVA_HOME "$JAVA_HOME"
          haxelib run lime config ANDROID_SETUP true

      - name: Build Lime target native library
        if: matrix.target == 'android' || matrix.target == 'ios'
        run: |
          set -euo pipefail
          if [ '${{ matrix.target }}' = android ]; then
            haxelib run lime rebuild android -arm64 -release
          else
            haxelib run lime rebuild ios -release
          fi

      - name: Configure SScript
        run: |
          echo 'oy9:showMacroty8:loopCosti25y10:includeAllfg' >> "$HOME/settings.cocoa"

      - name: Compile
        if: matrix.target != 'ios'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          FLAGS=(-D officialBuild)
          if [ '${{ matrix.target }}' = android ] && [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > release.keystore
            FLAGS+=(-D ANDROID_SIGNING)
          fi
          haxelib run lime build '${{ matrix.target }}' "${FLAGS[@]}" 2>&1 | tee compile.log

      - name: Generate iOS Xcode project
        if: matrix.target == 'ios'
        run: |
          set -euo pipefail
          haxelib run lime update ios -D officialBuild 2>&1 | tee compile.log
          find export/release/ios -maxdepth 2 -name '*.xcodeproj' -print

      - name: Build iOS
        if: matrix.target == 'ios'
        run: |
          set -euo pipefail
          PROJECT="$(find export/release/ios -maxdepth 2 -name '*.xcodeproj' -print -quit)"
          test -n "$PROJECT"
          xcodebuild -project "$PROJECT" -configuration Release -sdk iphoneos -arch arm64 CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' build 2>&1 | tee xcode.log

      - name: Package Android
        if: matrix.target == 'android'
        run: |
          set -euo pipefail
          find export -type f -name '*.apk' -print
          test -n "$(find export -type f -name '*.apk' -print -quit)"

      - name: Package Linux
        if: matrix.target == 'linux'
        run: |
          set -euo pipefail
          test -d export/release/linux/bin
          tar -czf PsychEngine-Linux.tar.gz -C export/release/linux/bin .

      - name: Package macOS
        if: matrix.target == 'mac'
        run: |
          set -euo pipefail
          APP="$(find export/release -type d -name '*.app' -print -quit)"
          test -n "$APP"
          ditto -c -k --keepParent "$APP" PsychEngine-macOS.zip

      - name: Package iOS
        if: matrix.target == 'ios'
        run: |
          set -euo pipefail
          APP="$(find export/release/ios -type d -name '*.app' -path '*iphoneos*' -print -quit)"
          test -n "$APP"
          mkdir -p ipa/Payload
          cp -R "$APP" ipa/Payload/
          (cd ipa && zip -qry ../PsychEngine.ipa Payload)

      - name: Upload Android APK
        if: matrix.target == 'android'
        uses: actions/upload-artifact@v4
        with:
          name: androidBuild
          path: export/**/*.apk
          if-no-files-found: error
          compression-level: 0

      - name: Upload Windows build
        if: matrix.target == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: windowsBuild
          path: export/release/windows/bin/
          if-no-files-found: error

      - name: Upload Linux build
        if: matrix.target == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: linuxBuild
          path: PsychEngine-Linux.tar.gz
          if-no-files-found: error

      - name: Upload macOS build
        if: matrix.target == 'mac'
        uses: actions/upload-artifact@v4
        with:
          name: macBuild
          path: PsychEngine-macOS.zip
          if-no-files-found: error

      - name: Upload iOS build
        if: matrix.target == 'ios'
        uses: actions/upload-artifact@v4
        with:
          name: iOSBuild
          path: PsychEngine.ipa
          if-no-files-found: error

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.target }}
          path: |
            compile.log
            xcode.log
          if-no-files-found: ignore
